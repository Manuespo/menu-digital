name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DISTRIBUTION_ID: E1JNQE0T485H8D
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build


      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::942198061038:role/github-actions-menu-digital-deploy
          aws-region: us-east-1

      # 1) Assets con hash en el nombre (main-XXXX.js, styles-XXXX.css, media/*):
      #    cacheables para siempre, el nombre cambia en cada build.
      - name: Sync to S3 (hashed assets)
        run: >-
          aws s3 sync dist/menu-digital/browser s3://aws-bucket-manuespo --delete
          --exclude "*" --include "*.js" --include "*.css" --include "media/*"
          --cache-control "public, max-age=31536000, immutable"

      # 2) Todo lo demás (index.html, favicon.ico, archivos de public/): sin hash,
      #    siempre se revalida. Va después de los assets para que el HTML nuevo
      #    nunca apunte a bundles que todavía no se subieron.
      - name: Sync to S3 (index.html y archivos sin hash)
        run: >-
          aws s3 sync dist/menu-digital/browser s3://aws-bucket-manuespo --delete
          --exclude "*.js" --exclude "*.css" --exclude "media/*"
          --cache-control "no-cache, must-revalidate"

      - name: Invalidate index.html
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/index.html" "/"
