<div
  class="app"
  [class.theme-clasico]="activeTheme === 'clasico'"
  [class.theme-moderno]="activeTheme === 'moderno'"
  [class.theme-elegante]="activeTheme === 'elegante'"
>
  <!--
    ⚠️ SELECTOR DE TEMAS TEMPORAL — SOLO PARA DESARROLLO ⚠️
    Sirve para previsualizar y comparar los 3 temas. NO es parte del producto final:
    se va a reemplazar por lógica que lea el tema desde una API (ver app.component.ts).
  -->
  <nav class="theme-switcher" aria-label="Previsualizar tema (solo desarrollo)">
    <button
      type="button"
      *ngFor="let tema of temas"
      [class.activo]="activeTheme === tema.id"
      [attr.aria-pressed]="activeTheme === tema.id"
      (click)="setTheme(tema.id)"
    >
      {{ tema.label }}
    </button>
  </nav>
  <!-- ⚠️ FIN SELECTOR TEMPORAL -->

  <div class="contenido">
    <header class="header">
      <!-- Fuera del *ngIf="menu" para poder cambiar de restaurante aunque falle la carga. -->
      <label class="selector-restaurante">
        <span>Restaurante</span>
        <select #selector (change)="irARestaurante(selector.value)">
          <option
            *ngFor="let r of opcionesRestaurante; trackBy: porRestaurantId"
            [value]="r.restaurantId"
            [selected]="r.restaurantId === restaurantId"
          >
            {{ r.nombre }}
          </option>
        </select>
      </label>
      <h1 *ngIf="menu">{{ menu.nombre }}</h1>
    </header>

    <p class="estado" *ngIf="!menu && !error">Cargando menú...</p>
    <p class="estado" *ngIf="error">No se pudo cargar el menú</p>

    <ng-container *ngIf="menu">

    <main class="menu">
      <section class="categoria" *ngFor="let categoria of menu.categorias">
        <h2>{{ categoria.nombre }}</h2>
        <ul>
          <li class="item" *ngFor="let item of categoria.productos">
            <div class="item-texto">
              <h3>{{ item.nombre }}</h3>
              <p class="descripcion" *ngIf="item.descripcion">{{ item.descripcion }}</p>
            </div>
            <span class="precio">{{ formatearPrecio(item.precio) }}</span>
          </li>
        </ul>
      </section>
    </main>

    <footer class="footer">
      <p>Precios en pesos argentinos, IVA incluido. Consultá por opciones sin TACC.</p>
    </footer>
    </ng-container>
  </div>
</div>

<router-outlet />
